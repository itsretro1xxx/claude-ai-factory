<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI Factory - Game Edition 🏭</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            gap: 10px;
            padding: 10px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* MAIN GAME WORLD */
        .game-world {
            flex: 1;
            background: linear-gradient(180deg, #0f1419 0%, #1a1f3a 100%);
            border: 3px solid #00ff00;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MINI MAP */
        .mini-map {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }

        .mini-map-title {
            color: #00d4ff;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mini-map-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .room-indicator {
            aspect-ratio: 1;
            border: 2px solid #00ff00;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 255, 0, 0.05);
            padding: 5px;
            text-align: center;
        }

        .room-indicator:hover {
            background: rgba(0, 255, 0, 0.15);
            transform: scale(1.05);
        }

        .room-indicator.active {
            border-color: #ff00ff;
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .room-icon {
            font-size: 1.5em;
        }

        .room-name {
            color: #00d4ff;
            font-size: 0.7em;
            font-weight: bold;
        }

        .room-workers {
            color: #00ff00;
            font-size: 0.65em;
        }

        /* STATS PANEL */
        .stats-panel {
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: #00d4ff;
        }

        .stat-value {
            color: #00ff00;
            font-weight: bold;
        }

        /* CONTROLS */
        .controls-panel {
            background: rgba(255, 0, 255, 0.05);
            border: 2px solid #ff00ff;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
        }

        .control-title {
            color: #ff00ff;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .movement-keys {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }

        .key {
            background: linear-gradient(135deg, #ff00ff 0%, #ff6600 100%);
            border: 1px solid #ff00ff;
            border-radius: 3px;
            padding: 6px;
            text-align: center;
            font-size: 0.75em;
            font-weight: bold;
            color: #fff;
        }

        .key-spacer {
            grid-column: 1 / 4;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-btn {
            background: linear-gradient(90deg, #00d4ff 0%, #00ff00 100%);
            border: 1px solid #00d4ff;
            border-radius: 3px;
            padding: 8px;
            font-size: 0.75em;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* PIXEL ART SPRITES */
        .sprite {
            position: absolute;
            font-size: 2em;
            user-select: none;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }

        .sprite.player {
            font-size: 2.5em;
            z-index: 100;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.8));
        }

        .sprite.npc {
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
        }

        .sprite.npc:hover {
            filter: drop-shadow(0 0 8px rgba(255, 255, 0, 0.8));
            transform: scale(1.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* ROOM DECORATION */
        .room-decoration {
            position: absolute;
            font-size: 1.5em;
            opacity: 0.3;
        }

        /* CONNECTION PATHS */
        svg.paths {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* MODAL FOR ACTIONS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            border: 3px solid #00d4ff;
            border-radius: 10px;
            padding: 30px;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .modal-header {
            font-size: 1.5em;
            color: #00d4ff;
            margin-bottom: 20px;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }

        .modal-body {
            color: #e0e0e0;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .close-btn {
            float: right;
            font-size: 1.5em;
            color: #00ff00;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #ff00ff;
            transform: scale(1.2);
        }

        /* ROOM BACKGROUND */
        .room-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8em;
            opacity: 0.1;
            z-index: 0;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            padding: 10px;
            font-size: 0.85em;
            z-index: 50;
        }

        .hud-title {
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.8);
        }

        .hud-stat {
            color: #00d4ff;
            margin-bottom: 3px;
        }

        .hud-stat-value {
            color: #ff00ff;
            font-weight: bold;
        }

        /* WORKER NAME LABEL */
        .worker-label {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #FFD700;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.7em;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid #FFD700;
        }

        /* SCROLLBAR */
        .mini-map::-webkit-scrollbar {
            width: 6px;
        }

        .mini-map::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 5px;
        }

        .mini-map::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 5px;
        }

        .mini-map::-webkit-scrollbar-thumb:hover {
            background: #00ff00;
        }

        /* LOADING ANIMATION */
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff00;
            animation: pulse 1s infinite;
            margin-right: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* INTERACTION HINT */
        .interaction-hint {
            position: absolute;
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid #ff00ff;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 0.8em;
            color: #ff00ff;
            pointer-events: none;
            animation: pulse-hint 1s infinite;
        }

        @keyframes pulse-hint {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .press-e {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 5px;
            font-size: 0.75em;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- GAME WORLD -->
        <div class="game-world">
            <!-- HUD -->
            <div class="hud">
                <div class="hud-title">👑 Nathan King (Boss)</div>
                <div class="hud-stat">Position: <span class="hud-stat-value" id="playerPos">0, 0</span></div>
                <div class="hud-stat">Room: <span class="hud-stat-value" id="playerRoom">Factory</span></div>
                <div class="hud-stat">Workers: <span class="hud-stat-value" id="totalWorkers">3</span></div>
            </div>

            <!-- SVG FOR PATHS -->
            <svg class="paths" id="pathsSvg"></svg>

            <!-- GAME CANVAS -->
            <div class="game-canvas" id="gameCanvas">
                <div class="room-bg" id="roomBg">🏭</div>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="mini-map">
            <div class="mini-map-title">⛏️ Factory Control</div>

            <!-- MINIMAP GRID -->
            <div class="mini-map-grid">
                <div class="room-indicator active" onclick="navigateToRoom(0)" data-room="0">
                    <div class="room-icon">🛍️</div>
                    <div class="room-name">Etsy Mine</div>
                    <div class="room-workers" id="workerCount0">1</div>
                </div>
                <div class="room-indicator" onclick="navigateToRoom(1)" data-room="1">
                    <div class="room-icon">🎬</div>
                    <div class="room-name">YT Studio</div>
                    <div class="room-workers" id="workerCount1">1</div>
                </div>
                <div class="room-indicator" onclick="navigateToRoom(2)" data-room="2">
                    <div class="room-icon">🔬</div>
                    <div class="room-name">Lab</div>
                    <div class="room-workers" id="workerCount2">1</div>
                </div>
            </div>

            <!-- STATS PANEL -->
            <div class="stats-panel">
                <div class="stat">
                    <span>Days Running:</span>
                    <span class="stat-value" id="daysRunning">0</span>
                </div>
                <div class="stat">
                    <span>Designs Made:</span>
                    <span class="stat-value" id="designsMade">0</span>
                </div>
                <div class="stat">
                    <span>Videos Made:</span>
                    <span class="stat-value" id="videosMade">0</span>
                </div>
                <div class="stat">
                    <span>Insights:</span>
                    <span class="stat-value" id="insightsMade">0</span>
                </div>
            </div>

            <!-- CONTROLS PANEL -->
            <div class="controls-panel">
                <div class="control-title">Movement Controls</div>
                <div class="movement-keys">
                    <div class="key"></div>
                    <div class="key">W</div>
                    <div class="key"></div>
                    <div class="key">A</div>
                    <div class="key">S</div>
                    <div class="key">D</div>
                    <div class="key key-spacer">MOVE AROUND</div>
                </div>

                <div class="control-title" style="margin-top: 10px;">Actions</div>
                <div class="action-buttons">
                    <button class="action-btn" onclick="performRoomAction()" id="roomActionBtn">
                        🔄 Generate
                    </button>
                    <button class="action-btn" onclick="talkToWorker()" id="talkBtn">
                        💬 Talk to Worker
                    </button>
                    <button class="action-btn" onclick="goBack()" style="margin-top: 10px;">
                        🔙 Main Hub
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div class="modal" id="actionModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-header" id="modalTitle">Action Complete</div>
            <div class="modal-body" id="modalBody">
                <div style="text-align: center; padding: 20px;">
                    <div class="loading" style="margin: 0 auto; width: 20px; height: 20px;"></div>
                    <p>Processing...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ PIXEL ART WORKER SPRITES ============
        const PIXEL_SPRITES = {
            // Alex - Green shirt, dark hair
            alex: {
                emoji: "🧑‍💻",
                name: "Alex",
                color: "#FF6B6B",
                char: "A"
            },
            // Maria - Red shirt, black hair
            maria: {
                emoji: "👩‍💼",
                name: "Maria",
                color: "#4ECDC4",
                char: "M"
            },
            // Sam - Blue shirt, blonde hair
            sam: {
                emoji: "👨‍🔧",
                name: "Sam",
                color: "#95E1D3",
                char: "S"
            },
            // Nathan King - With crown
            king: {
                emoji: "👑",
                name: "Nathan King",
                color: "#FFD700",
                char: "K"
            }
        };

        // ============ GAME STATE ============
        const gameState = {
            playerX: 400,
            playerY: 400,
            currentRoom: 0, // 0: Etsy, 1: YouTube, 2: Research
            rooms: [
                {
                    name: "🛍️ Etsy POD Mine",
                    icon: "🛍️",
                    decoration: "👕👔👗",
                    worker: PIXEL_SPRITES.alex,
                    action: "generate-design",
                    actionName: "Generate Design"
                },
                {
                    name: "🎬 YouTube Shorts Studio",
                    icon: "🎬",
                    decoration: "🎥📹🎞️",
                    worker: PIXEL_SPRITES.maria,
                    action: "generate-short",
                    actionName: "Generate Short"
                },
                {
                    name: "🔬 Research Lab",
                    icon: "🔬",
                    decoration: "🧪🧬⚗️",
                    worker: PIXEL_SPRITES.sam,
                    action: "analyze",
                    actionName: "Analyze Trends"
                }
            ],
            stats: {
                daysRunning: 0,
                designsMade: 0,
                videosMade: 0,
                insightsMade: 0
            },
            workers: [
                {
                    name: "Alex",
                    emoji: "🧑‍💻",
                    room: 0,
                    x: 300,
                    y: 300,
                    color: "#FF6B6B",
                    description: "Design Expert"
                },
                {
                    name: "Maria",
                    emoji: "👩‍💼",
                    room: 1,
                    x: 300,
                    y: 300,
                    color: "#4ECDC4",
                    description: "Video Director"
                },
                {
                    name: "Sam",
                    emoji: "👨‍🔧",
                    room: 2,
                    x: 300,
                    y: 300,
                    color: "#95E1D3",
                    description: "Research Analyst"
                }
            ],
            keys: {},
            lastInteraction: { worker: -1, time: 0 },
            inRoom: false
        };

        // ============ INITIALIZATION ============
        window.addEventListener('load', () => {
            initGame();
            updateUI();
            setInterval(updateFactoryStatus, 5000);
            setInterval(animateWorkers, 100);
            render();
        });

        function initGame() {
            // Setup keyboard listeners
            document.addEventListener('keydown', (e) => {
                gameState.keys[e.key.toLowerCase()] = true;
            });
            document.addEventListener('keyup', (e) => {
                gameState.keys[e.key.toLowerCase()] = false;
            });

            // Animation loop
            setInterval(() => {
                updatePlayerPosition();
                render();
            }, 30);
        }

        // ============ PLAYER MOVEMENT ============
        function updatePlayerPosition() {
            const speed = 5;
            if (gameState.keys['w']) gameState.playerY -= speed;
            if (gameState.keys['s']) gameState.playerY += speed;
            if (gameState.keys['a']) gameState.playerX -= speed;
            if (gameState.keys['d']) gameState.playerX += speed;

            // Boundary check
            const canvas = document.getElementById('gameCanvas');
            gameState.playerX = Math.max(30, Math.min(canvas.clientWidth - 30, gameState.playerX));
            gameState.playerY = Math.max(30, Math.min(canvas.clientHeight - 30, gameState.playerY));

            // Update HUD
            document.getElementById('playerPos').textContent =
                `${Math.round(gameState.playerX)}, ${Math.round(gameState.playerY)}`;
        }

        // ============ WORKER ANIMATION ============
        function animateWorkers() {
            gameState.workers.forEach((worker, i) => {
                if (worker.room === gameState.currentRoom) {
                    // Random movement within room
                    worker.x += (Math.random() - 0.5) * 2;
                    worker.y += (Math.random() - 0.5) * 2;

                    // Keep in bounds
                    const canvas = document.getElementById('gameCanvas');
                    worker.x = Math.max(50, Math.min(canvas.clientWidth - 50, worker.x));
                    worker.y = Math.max(50, Math.min(canvas.clientHeight - 50, worker.y));
                }
            });
        }

        // ============ RENDERING ============
        function render() {
            const canvas = document.getElementById('gameCanvas');
            canvas.innerHTML = '';

            // Room background
            const bgDiv = document.createElement('div');
            bgDiv.className = 'room-bg';
            bgDiv.textContent = gameState.rooms[gameState.currentRoom].icon;
            canvas.appendChild(bgDiv);

            // Draw decorations
            for (let i = 0; i < 5; i++) {
                const deco = document.createElement('div');
                deco.className = 'room-decoration';
                deco.style.left = (Math.random() * 90 + 5) + '%';
                deco.style.top = (Math.random() * 90 + 5) + '%';
                deco.textContent = gameState.rooms[gameState.currentRoom].decoration[
                    Math.floor(Math.random() * gameState.rooms[gameState.currentRoom].decoration.length)
                ];
                canvas.appendChild(deco);
            }

            // Draw workers in current room
            gameState.workers.forEach((worker, i) => {
                if (worker.room === gameState.currentRoom) {
                    const spriteContainer = document.createElement('div');
                    spriteContainer.style.position = 'absolute';
                    spriteContainer.style.left = worker.x + 'px';
                    spriteContainer.style.top = worker.y + 'px';
                    spriteContainer.style.display = 'flex';
                    spriteContainer.style.flexDirection = 'column';
                    spriteContainer.style.alignItems = 'center';
                    spriteContainer.style.cursor = 'pointer';

                    // Label
                    const label = document.createElement('div');
                    label.className = 'worker-label';
                    label.textContent = worker.name;
                    label.style.color = worker.color;
                    label.style.borderColor = worker.color;
                    spriteContainer.appendChild(label);

                    // Sprite
                    const sprite = document.createElement('div');
                    sprite.className = 'sprite npc';
                    sprite.textContent = worker.emoji;
                    sprite.style.color = worker.color;
                    sprite.title = `${worker.name} - ${worker.description}`;
                    sprite.onclick = (e) => {
                        e.stopPropagation();
                        showWorkerDialog(worker);
                    };

                    spriteContainer.appendChild(sprite);
                    canvas.appendChild(spriteContainer);
                }
            });

            // Draw player (Boss with crown)
            const playerContainer = document.createElement('div');
            playerContainer.style.position = 'absolute';
            playerContainer.style.left = gameState.playerX + 'px';
            playerContainer.style.top = gameState.playerY + 'px';
            playerContainer.style.display = 'flex';
            playerContainer.style.flexDirection = 'column';
            playerContainer.style.alignItems = 'center';

            // Player label
            const playerLabel = document.createElement('div');
            playerLabel.className = 'worker-label';
            playerLabel.textContent = '👑 King';
            playerLabel.style.color = '#FFD700';
            playerLabel.style.borderColor = '#FFD700';
            playerContainer.appendChild(playerLabel);

            // Player sprite
            const player = document.createElement('div');
            player.className = 'sprite player';
            player.textContent = '👑';
            player.style.color = '#FFD700';
            playerContainer.appendChild(player);

            canvas.appendChild(playerContainer);

            // Update HUD
            document.getElementById('playerRoom').textContent = gameState.rooms[gameState.currentRoom].name;
        }

        // ============ ROOM NAVIGATION ============
        function navigateToRoom(roomIndex) {
            gameState.currentRoom = roomIndex;
            gameState.playerX = 400;
            gameState.playerY = 400;
            gameState.inRoom = true;

            // Update mini-map
            document.querySelectorAll('.room-indicator').forEach((el, i) => {
                el.classList.toggle('active', i === roomIndex);
            });

            // Update button
            const room = gameState.rooms[roomIndex];
            document.getElementById('roomActionBtn').textContent = `🔄 ${room.actionName}`;

            render();
        }

        function goBack() {
            gameState.inRoom = false;
            gameState.currentRoom = 0;
            gameState.playerX = 400;
            gameState.playerY = 400;

            document.querySelectorAll('.room-indicator').forEach((el, i) => {
                el.classList.toggle('active', i === 0);
            });

            render();
        }

        // ============ ACTIONS ============
        function performRoomAction() {
            const room = gameState.rooms[gameState.currentRoom];
            showActionModal(room);
        }

        function talkToWorker() {
            const currentWorker = gameState.workers[gameState.currentRoom];
            showWorkerDialog(currentWorker);
        }

        async function showActionModal(room) {
            document.getElementById('actionModal').classList.add('active');
            document.getElementById('modalTitle').textContent = `⚡ ${room.actionName} - ${room.worker.name}`;
            document.getElementById('modalBody').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 2em; margin-bottom: 10px;">${room.worker.emoji}</div>
                    <div class="loading" style="margin: 0 auto; width: 20px; height: 20px;"></div>
                    <p>Generating ${room.actionName.toLowerCase()}...</p>
                </div>
            `;

            try {
                const endpoint = room.action === 'generate-design' ? '/api/etsy/generate-design' :
                                room.action === 'generate-short' ? '/api/youtube/generate-short' :
                                '/api/research/analyze';

                const response = await fetch(endpoint);
                const data = await response.json();

                if (data.status === 'success') {
                    updateStats(room.action);
                    showSuccessModal(room, data.data);
                } else {
                    document.getElementById('modalBody').innerHTML =
                        '<p style="color: #ff4444;">Error generating. Try again!</p>';
                }
            } catch (error) {
                document.getElementById('modalBody').innerHTML =
                    '<p style="color: #ff4444;">Connection error. Make sure server is running!</p>';
            }
        }

        function showSuccessModal(room, data) {
            let content = `<div style="text-align: center; margin-bottom: 15px;">
                <div style="font-size: 2em; margin-bottom: 10px;">${room.worker.emoji}</div>
                <h3 style="color: #00ff00; margin-bottom: 10px;">✅ ${room.actionName} Complete!</h3>
                <p style="color: ${room.worker.color}; font-weight: bold;">${room.worker.name} just finished!</p>
            </div>`;

            if (data.ideas || data.scripts || data.insights) {
                const info = data.ideas || data.scripts || data.insights;
                content += `<pre style="background: rgba(0, 255, 0, 0.1); padding: 15px; border-radius: 5px; overflow-x: auto; color: #00d4ff; max-height: 300px;">
${JSON.stringify(info, null, 2).substring(0, 1000)}...</pre>`;
            }

            content += `<p style="color: #00d4ff; margin-top: 15px; text-align: center;">
Keep it up ${room.worker.name}! 💪</p>`;

            document.getElementById('modalBody').innerHTML = content;
        }

        function showWorkerDialog(worker) {
            document.getElementById('actionModal').classList.add('active');
            document.getElementById('modalTitle').textContent = `💬 ${worker.name}`;
            document.getElementById('modalBody').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 3em; margin-bottom: 10px;">${worker.emoji}</div>
                    <p style="color: ${worker.color}; margin-bottom: 15px;"><strong>${worker.name}</strong></p>
                    <p style="margin-bottom: 10px;">🗣️ "Hey boss! I'm working hard on the ${gameState.rooms[worker.room].name} tasks!"</p>
                    <p style="color: #00ff00; margin-top: 15px;">📊 Tasks completed: ${Math.floor(Math.random() * 50) + 10}</p>
                    <p style="color: #ff00ff; margin-top: 10px;">⚡ Production: ${Math.floor(Math.random() * 100) + 50}%</p>
                    <p style="color: ${worker.color}; margin-top: 15px; font-size: 0.9em;">Role: ${worker.description}</p>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('actionModal').classList.remove('active');
        }

        function updateStats(action) {
            if (action === 'generate-design') gameState.stats.designsMade++;
            else if (action === 'generate-short') gameState.stats.videosMade++;
            else if (action === 'analyze') gameState.stats.insightsMade++;
            updateUI();
        }

        // ============ UI UPDATES ============
        async function updateFactoryStatus() {
            try {
                const response = await fetch('/api/factory-status');
                const data = await response.json();

                gameState.stats.daysRunning = data.days_running;

                data.workers.forEach((worker, index) => {
                    if (worker.metrics) {
                        if (index === 0) gameState.stats.designsMade = worker.metrics.products_created || 0;
                        else if (index === 1) gameState.stats.videosMade = worker.metrics.shorts_created || 0;
                        else if (index === 2) gameState.stats.insightsMade = worker.metrics.insights_generated || 0;
                    }
                });

                updateUI();
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        function updateUI() {
            document.getElementById('daysRunning').textContent = gameState.stats.daysRunning;
            document.getElementById('designsMade').textContent = gameState.stats.designsMade;
            document.getElementById('videosMade').textContent = gameState.stats.videosMade;
            document.getElementById('insightsMade').textContent = gameState.stats.insightsMade;
        }

        // Close modal on outside click
        window.onclick = (event) => {
            const modal = document.getElementById('actionModal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
